<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Change Password | PNN Computer Shop</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
  
  <!-- Styles -->
  <link rel="stylesheet" href="/css/styles.css">
  <style>
    .pw-container {
      max-width: 480px;
      margin: 4.5rem auto;
      padding: 0 1.5rem;
    }
    .pw-card {
      background: #ffffff;
      border-radius: var(--radius-lg, 16px);
      border: 1px solid var(--border-light, #e2e8f0);
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
      overflow: hidden;
    }
    .pw-header {
      padding: 2rem;
      background: linear-gradient(135deg, #0b0c10 0%, #161b22 100%);
      color: #ffffff;
      text-align: center;
    }
    .pw-header h2 {
      font-family: var(--font-heading, 'Poppins', sans-serif);
      font-size: 1.4rem;
      font-weight: 800;
      margin: 0 0 0.35rem 0;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
    }
    .pw-body {
      padding: 2rem;
    }
    .form-group {
      margin-bottom: 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 0.45rem;
    }
    .form-label {
      font-size: 0.85rem;
      font-weight: 700;
      color: #0f172a;
    }
    .form-control {
      padding: 0.85rem 1rem;
      border: 1px solid var(--border-light, #e2e8f0);
      border-radius: var(--radius-md, 10px);
      font-size: 0.95rem;
      background: #f8fafc;
      transition: all 0.2s ease;
      box-sizing: border-box;
      width: 100%;
    }
    .form-control:focus {
      outline: none;
      border-color: var(--primary, #0070f3);
      background: #ffffff;
      box-shadow: 0 0 0 3px rgba(0, 112, 243, 0.15);
    }
    .alert-banner {
      padding: 0.9rem 1.2rem;
      border-radius: 10px;
      margin-bottom: 1.5rem;
      font-size: 0.85rem;
      font-weight: 600;
    }
    .alert-success { background: #dcfce7; color: #15803d; border: 1px solid #bbf7d0; }
    .alert-info { background: #fef3c7; color: #92400e; border: 1px solid #fde68a; }
    .alert-error { background: #fee2e2; color: #b91c1c; border: 1px solid #fca5a5; }
  </style>
</head>
<body style="background-color: #f8fafc; font-family: 'Inter', sans-serif;">

  <div class="pw-container">
    <div class="pw-card">
      <div class="pw-header">
        <h2>
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#00e5ff" stroke-width="2.5"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
          Update Your Password
        </h2>
        <p style="color: #94a3b8; font-size: 0.85rem; margin: 0;">Account: <strong>{{USER_NAME}}</strong> ({{USER_ROLE}})</p>
      </div>

      <div class="pw-body">
        <!-- Alert placeholder -->
        <!-- {{ALERT_BANNER}} -->

        <form method="POST" action="/change-password">
          <div class="form-group">
            <label class="form-label" for="currentPassword">Current Password <span style="color: #ef4444;">*</span></label>
            <input type="password" id="currentPassword" name="currentPassword" class="form-control" placeholder="Enter current password" required autofocus>
          </div>

          <div class="form-group">
            <label class="form-label" for="newPassword">New Password <span style="color: #ef4444;">*</span></label>
            <input type="password" id="newPassword" name="newPassword" class="form-control" placeholder="Minimum 4 characters" required minlength="4">
          </div>

          <div class="form-group">
            <label class="form-label" for="confirmPassword">Confirm New Password <span style="color: #ef4444;">*</span></label>
            <input type="password" id="confirmPassword" name="confirmPassword" class="form-control" placeholder="Repeat new password" required minlength="4">
          </div>

          <button type="submit" class="btn-primary" style="width: 100%; padding: 0.9rem; font-size: 1rem; margin-top: 0.5rem;">
            Update & Encrypt Password
          </button>
        </form>

        <div style="text-align: center; margin-top: 1.5rem;">
          <a href="/logout" style="color: #64748b; font-size: 0.85rem; text-decoration: underline;">Cancel and Sign Out</a>
        </div>
      </div>
    </div>
  </div>

</body>
</html>
