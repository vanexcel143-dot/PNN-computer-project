<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register New User | PNN Computer Shop</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
  
  <!-- Styles -->
  <link rel="stylesheet" href="/css/styles.css">
  <style>
    .form-container {
      max-width: 650px;
      margin: 3rem auto;
      padding: 0 1.5rem;
    }
    .form-card {
      background: #ffffff;
      border-radius: var(--radius-lg, 16px);
      border: 1px solid var(--border-light, #e2e8f0);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
      overflow: hidden;
    }
    .form-header {
      padding: 2rem;
      background: linear-gradient(135deg, #0b0c10 0%, #161b22 100%);
      color: #ffffff;
    }
    .form-header h2 {
      font-family: var(--font-heading, 'Poppins', sans-serif);
      font-size: 1.5rem;
      font-weight: 800;
      margin: 0 0 0.35rem 0;
      display: flex;
      align-items: center;
      gap: 0.65rem;
    }
    .form-body {
      padding: 2rem;
    }
    .form-group {
      margin-bottom: 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 0.45rem;
    }
    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
    }
    .form-label {
      font-size: 0.85rem;
      font-weight: 700;
      color: #0f172a;
    }
    .form-control, .form-select {
      padding: 0.8rem 1rem;
      border: 1px solid var(--border-light, #e2e8f0);
      border-radius: var(--radius-md, 10px);
      font-size: 0.95rem;
      background: #f8fafc;
      transition: all 0.2s ease;
      box-sizing: border-box;
      width: 100%;
    }
    .form-control:focus, .form-select:focus {
      outline: none;
      border-color: var(--primary, #0070f3);
      background: #ffffff;
      box-shadow: 0 0 0 3px rgba(0, 112, 243, 0.15);
    }
    .alert-error {
      background: #fee2e2;
      color: #b91c1c;
      border: 1px solid #fca5a5;
      padding: 0.85rem 1.25rem;
      border-radius: 10px;
      margin-bottom: 1.5rem;
      font-size: 0.9rem;
      font-weight: 600;
    }
    .form-actions {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 1rem;
      margin-top: 2rem;
      padding-top: 1.5rem;
      border-top: 1px solid var(--border-light, #e2e8f0);
    }
  </style>
</head>
<body style="background-color: #f8fafc; font-family: 'Inter', sans-serif;">

  <!-- Top Announcement Bar -->
  <aside class="top-announcement-bar" role="banner">
    <div class="container top-announcement-content">
      <span class="announcement-badge">PNN Node.js</span>
      <span>⚡ Register New Account into MySQL Database: <strong>pnn_project_db</strong></span>
      <a href="/users" style="color: #ffffff; text-decoration: underline; font-size: 0.8rem; margin-left: auto;">← Back to Users Management</a>
    </div>
  </aside>

  <div class="form-container">
    <div class="form-card">
      <div class="form-header">
        <h2>
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="8.5" cy="7" r="4"></circle><line x1="20" y1="8" x2="20" y2="14"></line><line x1="23" y1="11" x2="17" y2="11"></line></svg>
          Create New User Account
        </h2>
        <p style="color: #94a3b8; font-size: 0.85rem; margin: 0;">Passwords are encrypted with bcrypt before being saved to MySQL.</p>
      </div>

      <div class="form-body">
        <!-- Error alert placeholder -->
        <!-- {{ERROR_BANNER}} -->

        <form method="POST" action="/users/create">
          <div class="form-row">
            <div class="form-group">
              <label class="form-label" for="username">Username <span style="color: #ef4444;">*</span></label>
              <input type="text" id="username" name="username" class="form-control" placeholder="e.g. jdoe_tech" required minlength="3" maxlength="30" pattern="[a-zA-Z0-9_]+">
              <span style="font-size: 0.75rem; color: #64748b;">Letters, numbers, and underscores only.</span>
            </div>

            <div class="form-group">
              <label class="form-label" for="password">Initial Password <span style="color: #ef4444;">*</span></label>
              <input type="password" id="password" name="password" class="form-control" placeholder="••••••••" required minlength="4">
              <span style="font-size: 0.75rem; color: #64748b;">Hashed with bcrypt upon saving.</span>
            </div>
          </div>

          <div class="form-group">
            <label class="form-label" for="full_name">Full Name <span style="color: #ef4444;">*</span></label>
            <input type="text" id="full_name" name="full_name" class="form-control" placeholder="e.g. John Doe" required minlength="2" maxlength="120">
          </div>

          <div class="form-row">
            <div class="form-group">
              <label class="form-label" for="email">Email Address <span style="color: #ef4444;">*</span></label>
              <input type="email" id="email" name="email" class="form-control" placeholder="johndoe@pnntech.com" required maxlength="120">
            </div>

            <div class="form-group">
              <label class="form-label" for="contact_number">Contact Number</label>
              <input type="text" id="contact_number" name="contact_number" class="form-control" placeholder="+63 912 345 6789" maxlength="30">
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label class="form-label" for="user_type_id">User Role / Type <span style="color: #ef4444;">*</span></label>
              <select id="user_type_id" name="user_type_id" class="form-select" required>
                <option value="">-- Select Assigned Role --</option>
                <!-- {{ROLE_OPTIONS}} -->
              </select>
            </div>

            <div class="form-group">
              <label class="form-label" for="status">Initial Account Status</label>
              <select id="status" name="status" class="form-select">
                <option value="ACTIVE" selected>ACTIVE (Can log in)</option>
                <option value="INACTIVE">INACTIVE (Temporarily suspended)</option>
              </select>
            </div>
          </div>

          <div class="form-actions">
            <a href="/users" class="btn-secondary" style="color: #475569; border: 1px solid #cbd5e1; text-decoration: none;">Cancel</a>
            <button type="submit" class="btn-primary">Create User Account</button>
          </div>
        </form>
      </div>
    </div>
  </div>

</body>
</html>
