<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edit User #{{USER_ID}} | PNN Computer Shop</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
  
  <!-- Styles -->
  <link rel="stylesheet" href="/css/styles.css">
  <style>
    .form-container {
      max-width: 650px;
      margin: 3rem auto;
      padding: 0 1.5rem;
    }
    .form-card {
      background: #ffffff;
      border-radius: var(--radius-lg, 16px);
      border: 1px solid var(--border-light, #e2e8f0);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
      overflow: hidden;
    }
    .form-header {
      padding: 2rem;
      background: linear-gradient(135deg, #0b0c10 0%, #161b22 100%);
      color: #ffffff;
    }
    .form-header h2 {
      font-family: var(--font-heading, 'Poppins', sans-serif);
      font-size: 1.5rem;
      font-weight: 800;
      margin: 0 0 0.35rem 0;
      display: flex;
      align-items: center;
      gap: 0.65rem;
    }
    .form-body {
      padding: 2rem;
    }
    .form-group {
      margin-bottom: 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 0.45rem;
    }
    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
    }
    .form-label {
      font-size: 0.85rem;
      font-weight: 700;
      color: #0f172a;
    }
    .form-control, .form-select {
      padding: 0.8rem 1rem;
      border: 1px solid var(--border-light, #e2e8f0);
      border-radius: var(--radius-md, 10px);
      font-size: 0.95rem;
      background: #f8fafc;
      transition: all 0.2s ease;
      box-sizing: border-box;
      width: 100%;
    }
    .form-control:focus, .form-select:focus {
      outline: none;
      border-color: var(--primary, #0070f3);
      background: #ffffff;
      box-shadow: 0 0 0 3px rgba(0, 112, 243, 0.15);
    }
    .alert-error {
      background: #fee2e2;
      color: #b91c1c;
      border: 1px solid #fca5a5;
      padding: 0.85rem 1.25rem;
      border-radius: 10px;
      margin-bottom: 1.5rem;
      font-size: 0.9rem;
      font-weight: 600;
    }
    .form-actions {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 1rem;
      margin-top: 2rem;
      padding-top: 1.5rem;
      border-top: 1px solid var(--border-light, #e2e8f0);
    }
    .radio-group {
      display: flex;
      gap: 1.5rem;
      margin-top: 0.25rem;
    }
    .radio-label {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.9rem;
      cursor: pointer;
    }
  </style>
</head>
<body style="background-color: #f8fafc; font-family: 'Inter', sans-serif;">

  <!-- Top Announcement Bar -->
  <aside class="top-announcement-bar" role="banner">
    <div class="container top-announcement-content">
      <span class="announcement-badge">PNN Node.js</span>
      <span>⚡ Editing User Account <strong>#{{USER_ID}}</strong> in MySQL</span>
      <a href="/users" style="color: #ffffff; text-decoration: underline; font-size: 0.8rem; margin-left: auto;">← Back to Users Management</a>
    </div>
  </aside>

  <div class="form-container">
    <div class="form-card">
      <div class="form-header">
        <h2>
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
          Edit User Account #{{USER_ID}}
        </h2>
        <p style="color: #94a3b8; font-size: 0.85rem; margin: 0;">Update account credentials, contact info, role, or account status.</p>
      </div>

      <div class="form-body">
        <!-- Error alert placeholder -->
        <!-- {{ERROR_BANNER}} -->

        <form method="POST" action="/users/edit/{{USER_ID}}">
          <div class="form-row">
            <div class="form-group">
              <label class="form-label" for="username">Username <span style="color: #ef4444;">*</span></label>
              <input type="text" id="username" name="username" class="form-control" value="{{USERNAME}}" required minlength="3" maxlength="30" pattern="[a-zA-Z0-9_]+">
            </div>

            <div class="form-group">
              <label class="form-label" for="full_name">Full Name <span style="color: #ef4444;">*</span></label>
              <input type="text" id="full_name" name="full_name" class="form-control" value="{{FULL_NAME}}" required minlength="2" maxlength="120">
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label class="form-label" for="email">Email Address <span style="color: #ef4444;">*</span></label>
              <input type="email" id="email" name="email" class="form-control" value="{{EMAIL}}" required maxlength="120">
            </div>

            <div class="form-group">
              <label class="form-label" for="contact_number">Contact Number</label>
              <input type="text" id="contact_number" name="contact_number" class="form-control" value="{{CONTACT}}" maxlength="30">
            </div>
          </div>

          <div class="form-group">
            <label class="form-label" for="user_type_id">Assigned User Role / Type <span style="color: #ef4444;">*</span></label>
            <select id="user_type_id" name="user_type_id" class="form-select" required>
              <!-- {{ROLE_OPTIONS}} -->
            </select>
          </div>

          <div class="form-group">
            <label class="form-label">Account Status</label>
            <div class="radio-group">
              <label class="radio-label">
                <input type="radio" name="status" value="ACTIVE" {{STATUS_ACTIVE_CHECKED}} style="accent-color: #16a34a;">
                <span style="font-weight: 600; color: #166534;">ACTIVE</span>
              </label>
              <label class="radio-label">
                <input type="radio" name="status" value="INACTIVE" {{STATUS_INACTIVE_CHECKED}} style="accent-color: #d97706;">
                <span style="font-weight: 600; color: #b45309;">INACTIVE</span>
              </label>
              <label class="radio-label">
                <input type="radio" name="status" value="DEACTIVATED" {{STATUS_DEACTIVATED_CHECKED}} style="accent-color: #64748b;">
                <span style="font-weight: 600; color: #64748b;">DEACTIVATED</span>
              </label>
            </div>
          </div>

          <div class="form-actions">
            <a href="/users" class="btn-secondary" style="color: #475569; border: 1px solid #cbd5e1; text-decoration: none;">Cancel</a>
            <button type="submit" class="btn-primary">Save Changes</button>
          </div>
        </form>
      </div>
    </div>
  </div>

</body>
</html>
